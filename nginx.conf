# MAK Tours & Travels ERP - Production Nginx Reverse Proxy Configuration
# Deployable to IOP Server (/etc/nginx/sites-available/mak-erp)

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Replace with your IOP server IP or domain

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is configured)
    # return 301 https://$host$request_uri;

    # Static Frontend SPA Root (built using: npm run build --prefix frontend)
    root /var/www/mak-erp/frontend/dist;
    index index.html;

    # Max body size for avatar and document uploads (25MB)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API Reverse Proxy: Forward all /api/ requests to Node.js Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 2. Static Uploads Reverse Proxy: Avatars & Documents
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Static Assets Caching (Vite immutable assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 4. React Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
